<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heaven's Crater Archive</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="dust-layer"></div>

<audio id="ambient" loop>
    <source src="assets/audio/ambience.mp3" type="audio/mp3">
</audio>

<audio id="pageSound">
    <source src="assets/audio/page-turn.mp3" type="audio/mp3">
</audio>


<header>

<h1>Heaven's Crater Archive</h1>

<button id="soundToggle">
🔇 Ambient
</button>

</header>



<main>


<section id="desk">


<img 
class="desk-image"
src="assets/images/desk.webp"
alt="Ancient wooden writing desk">


<div class="desk-items">


<div 
class="stack"
data-file="valenari">

<img src="assets/images/parchment.webp">

<p>Valenari Records</p>

</div>



<div 
class="stack"
data-file="luxifer">

<img src="assets/images/parchment.webp">

<p>Luxifer Archives</p>

</div>



<div 
class="stack"
data-file="sovenna">

<img src="assets/images/parchment.webp">

<p>Sovenna Journals</p>

</div>



<div 
class="stack"
data-file="knowledge">

<img src="assets/images/parchment.webp">

<p>The Bound Knowledge</p>

</div>



<div 
class="stack"
data-file="timeline">

<img src="assets/images/parchment.webp">

<p>Timeline</p>

</div>



</div>


<img 
class="quill"
src="assets/images/quill.webp">


<div class="candle">

<img src="assets/images/candle.webp">

</div>


</section>




<section id="archive" class="hidden">


<div class="book">


<button id="close">
✕ Close Archive
</button>



<div id="pages">


<h2 id="title">
Archive
</h2>


<div id="content">

Open a record.

</div>



</div>



<div class="controls">

<button id="prev">
← Previous
</button>


<button id="next">
Next →
</button>


</div>


</div>


</section>




</main>


<script src="script.js"></script>

</body>

</html>
